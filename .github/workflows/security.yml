name: Security audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"     # every Monday
  push:
    paths: ["requirements.txt", ".github/workflows/security.yml"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the app's libraries (same as the installer build)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools pyinstaller pip-audit
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Check for known vulnerabilities
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -m pip_audit --progress-spinner off --skip-editable -f json -o audit.json
          $code = $LASTEXITCODE
          python tools/audit_summary.py audit.json
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit
          path: audit.json
