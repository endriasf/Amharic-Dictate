name: Build Windows installer

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
    inputs:
      model_source:
        description: "Speech model to package inside the app (Hugging Face id). Empty = download on first launch."
        required: false
        default: ""
  push:
    tags: ["v*"]              # e.g. git tag v1.0.0 && git push --tags  -> GitHub Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build app + installer (includes self-test)
        shell: pwsh
        env:
          MODEL_SOURCE: ${{ inputs.model_source || vars.MODEL_SOURCE }}
        run: ./build/build.ps1

      - name: Security check of bundled libraries (known vulnerabilities)
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python -m pip install pip-audit
          python -m pip_audit --progress-spinner off --skip-editable 2>&1 | Tee-Object -FilePath build/Output/security-audit.txt
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::pip-audit reported known vulnerabilities - see security-audit.txt" }
          exit 0

      - name: Installer checksum (SHA-256)
        shell: pwsh
        run: |
          Get-ChildItem build/Output/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -FilePath "build/Output/SHA256SUMS.txt" -Append
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: AmharicDictate-Setup
          path: |
            build/Output/*.exe
            build/Output/SHA256SUMS.txt
            build/Output/security-audit.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Output/*.exe
            build/Output/SHA256SUMS.txt
          generate_release_notes: true
