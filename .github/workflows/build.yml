name: Build Windows installer

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
    inputs:
      model_source:
        description: "Speech model to package inside the app (Hugging Face id). Empty = download on first launch."
        required: false
        default: ""
  push:
    tags: ["v*"]              # e.g. git tag v1.0.0 && git push --tags  -> GitHub Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build app + installer (includes self-test)
        shell: pwsh
        env:
          MODEL_SOURCE: ${{ inputs.model_source || vars.MODEL_SOURCE }}
        run: ./build/build.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmharicDictate-Setup
          path: build/Output/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Output/*.exe
          generate_release_notes: true
